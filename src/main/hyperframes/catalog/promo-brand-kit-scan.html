<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Brand Kit Scan</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:600px;transform:translate(-50%,-50%);padding:29px;border-radius:24px;background:rgba(12,26,45,.97);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.top{display:flex;align-items:center;gap:15px;margin-bottom:22px}.scan{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent);font-size:25px}.title{font-size:27px;font-weight:800}.checks{display:grid;gap:11px}.check{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff15}.icon{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#79e3a020;color:#82eaa4;font-weight:800}.value{margin-left:auto;color:#b9c8dc;font:600 14px 'Geist Mono',monospace;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.label{font-size:17px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body><div class="card" id="root"><div class="top"><div class="scan">✦</div><div class="title" id="title"></div></div><div class="checks" id="checks"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('title').textContent=v.title??'BRAND KIT SCAN';const checks=document.getElementById('checks');(Array.isArray(v.checks)?v.checks.slice(0,6):[]).forEach(item=>{const row=document.createElement('div');row.className='check';row.innerHTML='<span class="icon">✓</span><span class="label"></span><span class="value"></span>';row.querySelector('.label').textContent=String(item?.label??'Check');row.querySelector('.value').textContent=String(item?.value??item?.status??'Ready');checks.append(row)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:32,scale:.95},{opacity:1,y:0,scale:1,duration:.42});tl.from('.check',{opacity:0,x:18,stagger:.09,duration:.24},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
