<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Hook Test</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:620px;transform:translate(-50%,-50%);padding:28px;border-radius:24px;background:rgba(14,28,48,.97);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.eyebrow{font-size:14px;color:#b9c8dc;letter-spacing:.14em}.title{font-size:29px;font-weight:800;margin:8px 0 18px}.variants{display:grid;gap:11px}.variant{padding:15px 17px;border-radius:15px;background:#ffffff0c;border:1px solid #ffffff18;position:relative}.winner{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}.mark{position:absolute;right:14px;top:12px;color:#8af0ae;font-size:12px;font-weight:800;letter-spacing:.1em}.variant-label{font:700 13px 'Geist Mono',monospace;color:var(--accent);margin-bottom:6px}.copy{font-size:18px;font-weight:650;max-width:470px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.metric{margin-top:8px;color:#b9c8dc;font-size:13px}
</style></head><body><div class="card" id="root"><div class="eyebrow">A/B EXPERIMENT</div><div class="title" id="title"></div><div class="variants" id="variants"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('title').textContent=v.title??'HOOK TEST';const list=document.getElementById('variants');(Array.isArray(v.variants)?v.variants.slice(0,4):[]).forEach(item=>{const row=document.createElement('div');row.className='variant'+(item?.winner?' winner':'');row.innerHTML='<div class="variant-label"></div><div class="copy"></div><div class="metric"></div>'+(item?.winner?'<div class="mark">WINNER</div>':'');row.querySelector('.variant-label').textContent=String(item?.label??'Variant');row.querySelector('.copy').textContent=String(item?.text??'');row.querySelector('.metric').textContent=String(item?.metric??'');list.append(row)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:32,scale:.95},{opacity:1,y:0,scale:1,duration:.42});tl.from('.variant',{opacity:0,scale:.96,stagger:.1,duration:.25},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
