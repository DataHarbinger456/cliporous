<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Platform Export</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:600px;transform:translate(-50%,-50%);padding:30px;border-radius:24px;background:linear-gradient(145deg,rgba(29,53,87,.98),rgba(9,20,36,.97));border:1px solid #ffffff25;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.eyebrow{font-size:14px;letter-spacing:.14em;color:#b9c8dc;text-transform:uppercase}.title{font-size:30px;font-weight:800;margin:8px 0 22px}.platforms{display:grid;gap:10px}.platform{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:14px;background:#ffffff10}.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}.name{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:13px;color:#81e6a6;text-transform:uppercase;letter-spacing:.08em}
</style></head><body><div class="card" id="root"><div class="eyebrow">DISTRIBUTION ENGINE</div><div class="title" id="label"></div><div class="platforms" id="platforms"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('label').textContent=v.label??'READY TO PUBLISH';const list=document.getElementById('platforms');(Array.isArray(v.platforms)?v.platforms.slice(0,8):[]).forEach(item=>{const row=document.createElement('div');row.className='platform';row.innerHTML='<span class="dot"></span><span class="name"></span><span class="status"></span>';row.querySelector('.name').textContent=String(item?.name??'Platform');row.querySelector('.status').textContent=String(item?.status??'ready');list.append(row)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,x:-35,scale:.96},{opacity:1,x:0,scale:1,duration:.42});tl.from('.platform',{opacity:0,x:20,stagger:.09,duration:.24},.2);tl.to(root,{opacity:0,x:25,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
