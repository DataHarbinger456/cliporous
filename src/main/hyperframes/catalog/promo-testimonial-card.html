<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Testimonial Card</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:620px;transform:translate(-50%,-50%);padding:30px;border-radius:24px;background:linear-gradient(145deg,rgba(29,53,87,.98),rgba(10,22,39,.97));border:1px solid #ffffff2b;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.quote{font-size:27px;line-height:1.2;font-weight:700;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.quote:before{content:'“';color:var(--accent);font-size:54px;line-height:0;vertical-align:-18px;margin-right:5px}.footer{display:flex;align-items:end;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid #ffffff1f}.name{font-size:18px;font-weight:800}.role{font-size:14px;color:#b9c8dc;margin-top:4px}.result{color:#8aefab;font-weight:800;font-size:18px;max-width:180px;text-align:right}
</style></head><body><div class="card" id="root"><div class="quote" id="quote"></div><div class="footer"><div><div class="name" id="name"></div><div class="role" id="role"></div></div><div class="result" id="result"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');[['quote','quote'],['name','name'],['role','role'],['result','result']].forEach(([id,key])=>document.getElementById(id).textContent=String(v[key]??''));const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:35,scale:.94},{opacity:1,y:0,scale:1,duration:.45});tl.from('.footer',{opacity:0,y:12,duration:.3},.3);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
