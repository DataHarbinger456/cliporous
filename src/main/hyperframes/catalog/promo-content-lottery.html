<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Content Lottery</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:620px;transform:translate(-50%,-50%);padding:29px;border-radius:24px;background:linear-gradient(145deg,rgba(29,53,87,.98),rgba(10,22,39,.97));border:1px solid #ffffff25;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.eyebrow{font-size:14px;letter-spacing:.14em;color:#b9c8dc}.title{font-size:28px;font-weight:800;margin:8px 0 20px}.items{display:grid;gap:10px}.item{display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:14px;background:#ffffff0c;border:1px solid #ffffff18}.item.winner{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}.rank{font:700 14px 'Geist Mono',monospace;color:#b9c8dc}.label{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-weight:800;color:var(--accent)}.winner .score{color:#9bf3b7}.pick{font-size:12px;letter-spacing:.1em;color:#9bf3b7;font-weight:800}
</style></head><body><div class="card" id="root"><div class="eyebrow">CONTENT LOTTERY</div><div class="title" id="title"></div><div class="items" id="items"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('title').textContent=v.title??'PICK YOUR NEXT POST';const items=document.getElementById('items'),winner=Math.max(0,Math.min(7,Number(v.winnerIndex??0)));(Array.isArray(v.items)?v.items.slice(0,8):[]).forEach((item,i)=>{const row=document.createElement('div');row.className='item'+(i===winner?' winner':'');row.innerHTML='<span class="rank"></span><span class="label"></span><span class="score"></span>'+(i===winner?'<span class="pick">PICK</span>':'');row.querySelector('.rank').textContent=String(i+1).padStart(2,'0');row.querySelector('.label').textContent=String(item?.label??'Idea');row.querySelector('.score').textContent=String(item?.score??'');items.append(row)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:34,scale:.94},{opacity:1,y:0,scale:1,duration:.42});tl.from('.item',{opacity:0,x:-18,stagger:.08,duration:.23},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
