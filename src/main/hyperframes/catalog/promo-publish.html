<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head>
  <meta charset="utf-8">
  <title>HyperFrames — Promo Publish</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Media Master "Publish to 9 platforms" — the app's Composer card.
       Light Rice-Paper window chrome + real brand-icon tiles + the Deep Indigo
       pill button with its 4px offset shadow (mirrors landing .btn-mm). */
    :root {
      --mm-shell: #f9f9fa;   --mm-white: #ffffff;
      --mm-bean: #1a1a24;    --mm-umber: #4b6284;
      --mm-indigo: #1d3557;  --mm-indigo-shadow: #0f1d34;
      --mm-border: rgba(29,53,87,0.1);
      --mm-font: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --mm-heading: 'Oswald', 'Arial Narrow', sans-serif;
    }
    .mm-composer {
      width: 660px; padding: 22px; border-radius: 28px;
      background: var(--mm-shell); border: 1px solid var(--mm-border);
      box-shadow: 0 30px 60px -20px rgba(15,29,52,0.4), 0 12px 24px -12px rgba(15,29,52,0.22);
      will-change: transform, opacity;
    }
    /* macOS window chrome — same as the landing Composer mock. */
    .mm-chrome { display: flex; align-items: center; gap: 9px; padding: 4px 6px 18px; }
    .mm-dot { width: 13px; height: 13px; border-radius: 50%; }
    .mm-chrome-label { margin-left: 8px; font-family: var(--mm-font); font-size: 17px; font-weight: 500; color: var(--mm-umber); }

    .mm-panel {
      border-radius: 22px; background: var(--mm-white);
      border: 1px solid var(--mm-border); padding: 26px;
    }
    .mm-panel-label {
      font-family: var(--mm-font); font-weight: 600; font-size: 15px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--mm-umber);
      margin-bottom: 18px;
    }
    .mm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .mm-tile {
      position: relative; aspect-ratio: 1 / 1; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px -4px rgba(15,29,52,0.25);
      will-change: transform, opacity;
    }
    .mm-tile svg { width: 50%; height: 50%; }
    .mm-tile-glow { position: absolute; inset: -5px; border-radius: 22px; z-index: -1; filter: blur(16px); opacity: 0; will-change: opacity; }

    /* Deep Indigo pill CTA — identical to the app's btn-mm. */
    .mm-btn {
      margin-top: 24px; width: 100%; padding: 20px 24px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border-radius: 100vw; background: var(--mm-indigo); color: var(--mm-white);
      font-family: var(--mm-font); font-weight: 600; font-size: 27px; letter-spacing: 0.01em;
      box-shadow: 0 6px 0 0 var(--mm-indigo-shadow);
      will-change: transform, opacity;
    }
    .mm-btn svg { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <div class="hf-center mm-composer" id="publish" data-composition-id="promo-publish" data-start="0" data-duration="3.5" data-track-index="0">
    <div class="mm-chrome">
      <span class="mm-dot" style="background:#ff5f57"></span>
      <span class="mm-dot" style="background:#febc2e"></span>
      <span class="mm-dot" style="background:#28c840"></span>
      <span class="mm-chrome-label">Composer</span>
    </div>
    <div class="mm-panel">
      <div class="mm-panel-label" id="panelLabel">Publishing to</div>
      <div class="mm-grid" id="grid"></div>
      <div class="mm-btn" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <span id="label"></span>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes?.getVariables?.() ?? {};
    const accent = v.accentColor ?? v.color ?? '#1d3557';
    const yPos = v.yPos ?? 50;
    const label = v.label ?? v.text ?? 'Publish to 9 platforms';

    // Real platform brand marks (single-path glyphs), matching the app's order.
    const PLATFORMS = {
      facebook:  { name: 'Facebook',  bg: '#1877F2', path: 'M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z' },
      instagram: { name: 'Instagram', bg: 'linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)', path: 'M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z' },
      linkedin:  { name: 'LinkedIn',  bg: '#0A66C2', path: 'M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z' },
      pinterest: { name: 'Pinterest', bg: '#BD081C', path: 'M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345c-.091.378-.293 1.194-.333 1.362-.052.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.632-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z' },
      reddit:    { name: 'Reddit',    bg: '#FF4500', path: 'M12 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 01-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 01.042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 014.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 01.14-.197.35.35 0 01.238-.042l2.906.617a1.214 1.214 0 011.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 00-.231.094.33.33 0 000 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 00.029-.463.33.33 0 00-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 00-.232-.095z' },
      threads:   { name: 'Threads',   bg: '#101014', ring: true, path: 'M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 013.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.99.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Z' },
      tiktok:    { name: 'TikTok',    bg: '#101014', ring: true, path: 'M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z' },
      x:         { name: 'X',         bg: '#101014', ring: true, path: 'M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z' },
      youtube:   { name: 'YouTube',   bg: '#FF0000', path: 'M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z' },
    };
    const DEFAULT_ORDER = ['facebook','instagram','linkedin','pinterest','reddit','threads','tiktok','x','youtube'];
    const requested = Array.isArray(v.platforms) && v.platforms.length
      ? v.platforms.filter((id) => PLATFORMS[id]) : DEFAULT_ORDER;
    const order = requested.length ? requested : DEFAULT_ORDER;

    const publishEl = document.getElementById('publish');
    publishEl.style.top = yPos + '%';
    document.getElementById('label').textContent = label;
    document.getElementById('btn').style.background = accent;
    document.getElementById('btn').style.boxShadow = '0 6px 0 0 #0f1d34';

    const grid = document.getElementById('grid');
    const tiles = [];
    for (const id of order) {
      const p = PLATFORMS[id];
      const tile = document.createElement('div');
      tile.className = 'mm-tile';
      tile.style.background = p.bg;
      if (p.ring) tile.style.border = '1px solid rgba(255,255,255,0.16)';
      tile.innerHTML =
        '<div class="mm-tile-glow"></div>' +
        '<svg viewBox="0 0 24 24" fill="#ffffff"><path d="' + p.path + '"/></svg>';
      const glow = tile.querySelector('.mm-tile-glow');
      glow.style.background = p.bg;
      grid.appendChild(tile);
      tiles.push({ tile, glow });
    }

    const dur = parseFloat(v.timingDuration ?? 3.5);
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    // Composer card slides in.
    tl.fromTo(publishEl, { opacity: 0, y: 34, scale: 0.95 },
      { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.2)' }, 0);

    // Tiles light up sequentially.
    const tileEls = tiles.map((t) => t.tile);
    const glowEls = tiles.map((t) => t.glow);
    gsap.set(tileEls, { opacity: 0.18, scale: 0.72, filter: 'saturate(0.35)' });
    tl.to(tileEls, { opacity: 1, scale: 1, filter: 'saturate(1)', duration: 0.32, stagger: 0.1, ease: 'back.out(2)' }, 0.35);
    tl.to(glowEls, { opacity: 0.5, duration: 0.2, stagger: 0.1, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.4);

    // Indigo CTA presses in, like a real click.
    tl.fromTo('#btn', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, '>-0.1');
    tl.to('#btn', { y: 4, boxShadow: '0 2px 0 0 #0f1d34', duration: 0.12, ease: 'power2.in' }, '>');
    tl.to('#btn', { y: 0, boxShadow: '0 6px 0 0 #0f1d34', duration: 0.18, ease: 'back.out(2)' }, '>');

    // Exit.
    tl.to(publishEl, { opacity: 0, y: -18, scale: 0.97, duration: 0.35, ease: 'power2.in' },
      Math.max(dur - 0.45, 1.2));
  </script>
</body>
</html>
