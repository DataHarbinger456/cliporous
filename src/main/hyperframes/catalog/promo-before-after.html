<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Promo Before After</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:630px;transform:translate(-50%,-50%);padding:26px;border-radius:24px;background:rgba(15,28,48,.96);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.eyebrow{font-size:14px;letter-spacing:.14em;color:#b9c8dc;margin-bottom:18px}.columns{display:grid;grid-template-columns:1fr 42px 1fr;gap:12px;align-items:stretch}.panel{padding:18px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff18;min-width:0}.panel.after{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 17%,transparent)}.label{font-size:13px;font-weight:800;letter-spacing:.12em;color:#b9c8dc}.text{font-size:21px;font-weight:750;line-height:1.15;margin:15px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.metric{font:700 14px 'Geist Mono',monospace;color:var(--accent)}.arrow{align-self:center;text-align:center;color:var(--accent);font-size:30px}
</style></head><body><div class="card" id="root"><div class="eyebrow">CONTENT TRANSFORMATION</div><div class="columns"><div class="panel"><div class="label" id="beforeLabel"></div><div class="text" id="beforeText"></div><div class="metric" id="beforeMetric"></div></div><div class="arrow">→</div><div class="panel after"><div class="label" id="afterLabel"></div><div class="text" id="afterText"></div><div class="metric" id="afterMetric"></div></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');[['beforeLabel','beforeLabel'],['beforeText','beforeText'],['beforeMetric','beforeMetric'],['afterLabel','afterLabel'],['afterText','afterText'],['afterMetric','afterMetric']].forEach(([id,key])=>document.getElementById(id).textContent=String(v[key]??''));const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:30,scale:.94},{opacity:1,y:0,scale:1,duration:.42});tl.from('.panel', {opacity:0,x:-18,stagger:.16,duration:.3},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
