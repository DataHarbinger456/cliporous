<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Content Calendar</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:620px;transform:translate(-50%,-50%);padding:28px;border-radius:24px;background:rgba(16,34,58,.96);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.month{font-size:27px;font-weight:800}.tag{font-size:13px;letter-spacing:.12em;color:#b9c8dc}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.day{min-height:105px;padding:12px;border-radius:15px;background:#ffffff0d;border:1px solid #ffffff16;display:flex;flex-direction:column;justify-content:space-between}.num{font:700 14px 'Geist Mono',monospace;color:var(--accent)}.daylabel{font-size:16px;font-weight:700;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.platform{font-size:12px;color:#b9c8dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#79e3a0;text-transform:uppercase;letter-spacing:.08em}
</style></head><body><div class="card" id="root"><div class="head"><div class="month" id="month"></div><div class="tag">MEDIA MASTER / PLAN</div></div><div class="days" id="days"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('month').textContent=v.month??'THIS WEEK';const days=document.getElementById('days');(Array.isArray(v.days)?v.days.slice(0,8):[]).forEach(item=>{const el=document.createElement('div');el.className='day';el.innerHTML='<span class="num"></span><span class="daylabel"></span><span class="platform"></span><span class="status"></span>';el.querySelector('.num').textContent=String(item?.day??'');el.querySelector('.daylabel').textContent=String(item?.label??'Content');el.querySelector('.platform').textContent=String(item?.platform??'');el.querySelector('.status').textContent=String(item?.status??'planned');days.append(el)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:34,scale:.95},{opacity:1,y:0,scale:1,duration:.4});tl.from('.day',{opacity:0,y:14,stagger:.07,duration:.25},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
