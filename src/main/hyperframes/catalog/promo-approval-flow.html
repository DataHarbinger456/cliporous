<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Approval Flow</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:600px;transform:translate(-50%,-50%);padding:29px;border-radius:24px;background:rgba(14,28,48,.97);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.eyebrow{font-size:14px;letter-spacing:.14em;color:#b9c8dc}.title{font-size:29px;font-weight:800;margin:8px 0 24px}.steps{display:grid;gap:0}.step{display:grid;grid-template-columns:36px 1fr;gap:13px;min-height:61px;position:relative}.step:not(:last-child):after{content:'';position:absolute;left:16px;top:33px;width:2px;height:42px;background:#ffffff20}.circle{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff30;color:#b9c8dc;font-weight:800;z-index:1}.done .circle{background:var(--accent);border-color:var(--accent);color:#fff}.step-label{font-size:18px;font-weight:700;line-height:33px}.status{font-size:12px;color:#b9c8dc;margin-top:-7px;text-transform:uppercase;letter-spacing:.08em}.done .status{color:#85e9a4}
</style></head><body><div class="card" id="root"><div class="eyebrow">COLLABORATION</div><div class="title" id="title"></div><div class="steps" id="steps"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('title').textContent=v.title??'APPROVAL FLOW';const list=document.getElementById('steps');(Array.isArray(v.steps)?v.steps.slice(0,6):[]).forEach((item,i)=>{const row=document.createElement('div');row.className='step'+(String(item?.status??'').toLowerCase()==='done'?' done':'');row.innerHTML='<div class="circle"></div><div><div class="step-label"></div><div class="status"></div></div>';row.querySelector('.circle').textContent=row.classList.contains('done')?'✓':String(i+1);row.querySelector('.step-label').textContent=String(item?.label??'Step');row.querySelector('.status').textContent=String(item?.status??'pending');list.append(row)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:32,scale:.95},{opacity:1,y:0,scale:1,duration:.42});tl.from('.step',{opacity:0,x:-18,stagger:.1,duration:.25},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
