<!DOCTYPE html>
<html data-width="720" data-height="1280">
<head><meta charset="utf-8"><title>HyperFrames — Caption Sync</title><link rel="stylesheet" href="shared/styles.css"><style>
.card{position:absolute;left:50%;width:620px;transform:translate(-50%,-50%);padding:30px;border-radius:24px;background:rgba(14,27,47,.97);border:1px solid #ffffff22;box-shadow:0 24px 70px #000b;color:#fff;font-family:Inter,sans-serif}.label{font-size:14px;letter-spacing:.14em;color:#b9c8dc;margin-bottom:22px}.words{display:flex;flex-wrap:wrap;gap:9px 12px;line-height:1.2}.word{font-size:31px;font-weight:800;color:#ffffff55;transition:color .2s}.word.active{color:var(--accent);text-shadow:0 0 18px var(--accent)}.rule{height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:25px;border-radius:3px}
</style></head><body><div class="card" id="root"><div class="label" id="label"></div><div class="words" id="words"></div><div class="rule"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
const v=window.__hyperframes?.getVariables?.()??{},root=document.getElementById('root');root.style.top=Math.max(10,Math.min(90,Number(v.yPos??50)))+'%';root.style.setProperty('--accent',v.accentColor??'#1d3557');document.getElementById('label').textContent=v.label??'CAPTION SYNC';const words=document.getElementById('words'),list=Array.isArray(v.words)?v.words.slice(0,12):[];list.forEach((word,i)=>{const el=document.createElement('span');el.className='word'+(i===Number(v.activeIndex??0)?' active':'');el.textContent=String(word?.text??word??'');words.append(el)});const dur=Math.max(.6,Number(v.timingDuration??2.5)),tl=gsap.timeline({defaults:{ease:'power3.out'}});tl.fromTo(root,{opacity:0,y:30,scale:.95},{opacity:1,y:0,scale:1,duration:.42});tl.from('.word',{opacity:0,y:12,stagger:.05,duration:.2},.2);tl.to(root,{opacity:0,y:-18,duration:.3,ease:'power2.in'},Math.max(dur-.4,.6));
</script></body></html>
